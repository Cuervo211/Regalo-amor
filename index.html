<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Bebita 💜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Corazones flotando -->
    <div class="corazones"></div>

    <!-- Gatitos -->
    <img src="img/gatito-izq.png" class="gatito izquierdo">
    <img src="img/gatito-der.png" class="gatito derecho">

    <!-- Inicio -->
    <section id="inicio" class="pantalla">
        <h1 class="brillo">💜 Un Regalito por el 14 de Febrero 💜</h1>
        <button id="btnInicio" class="btn">💜 Toca para Enamorarte 💜</button>
    </section>

    <!-- Contenido -->
    <section id="contenido" class="pantalla oculto">

        <!-- Carrusel -->
        <div class="carrusel">
            <img src="img/foto1.jpg" class="slide activo">
            <img src="img/foto2.jpg" class="slide">
            <img src="img/foto3.jpg" class="slide">
        </div>

        <!-- Mensajes personalizables -->
        <p class="mensaje">Me alegro de tenerte en mi vida Gordita 💕</p>
        <p class="mensaje">Con vos los dias toman Color 💜</p>

        <button id="btnFinal" class="btn">Mensaje final</button>

        <h1 id="teAmo" class="te-amo oculto">TE AMO HOY MAÑANA Y SIEMPRE 💜</h1>
        <p class="fecha oculto" id="fecha">💜 14 de Febrero 💜</p>

    </section>

    <script src="script.js"></script>
</body>
</html>
